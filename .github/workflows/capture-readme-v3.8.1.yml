name: Refresh README screenshots for v3.8.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-readme-v3.8.1.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture current public pages
        run: |
          mkdir -p docs/screenshots
          npx --yes playwright@1.55.0 screenshot --device="Desktop Chrome" --viewport-size="1440,900" --wait-for-timeout=2500 \
            "https://github.com/jonnyt123/humanizer-chatgpt-plugin/releases/tag/v3.8.1" \
            docs/screenshots/release.png
          npx --yes playwright@1.55.0 screenshot --device="Desktop Chrome" --viewport-size="1440,900" --wait-for-timeout=2500 \
            "https://github.com/jonnyt123/humanizer-chatgpt-plugin/actions/workflows/validate.yml" \
            docs/screenshots/validation.png
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/release.png docs/screenshots/validation.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "Refresh README screenshots for v3.8.1"
          git push
