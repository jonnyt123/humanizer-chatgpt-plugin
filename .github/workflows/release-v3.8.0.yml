name: Release Humanizer v3.8.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v3.8.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v3.8.0 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 94c7e57664a1e4b08d3029a77b2c1d2e316487d7
        run: |
          set -euo pipefail
          if gh release view v3.8.0 >/dev/null 2>&1; then
            echo "Release v3.8.0 already exists."
            exit 0
          fi
          if ! git ls-remote --tags origin refs/tags/v3.8.0 | grep -q .; then
            git tag v3.8.0 "$TARGET_SHA"
            git push origin refs/tags/v3.8.0
          fi
          gh release create v3.8.0 --target "$TARGET_SHA" --title "Humanizer v3.8.0" --notes "Initial public release of Humanizer v3.8.0. Includes prose and lyric humanization, voice fingerprinting, lyric artifact scoring, rap technique scoring, score-guided rewrites, 16-bar verse optimization, verse-to-hook optimization, BPM/meter-aware pocket analysis, and contextual bar-by-bar flow generation."
