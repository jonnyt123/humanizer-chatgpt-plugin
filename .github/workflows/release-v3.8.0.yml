name: Release Humanizer v3.8.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v3.8.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v3.8.0 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 94c7e57664a1e4b08d3029a77b2c1d2e316487d7
        run: |
          set -euo pipefail

          if gh release view v3.8.0 >/dev/null 2>&1; then
            echo "Release v3.8.0 already exists."
            exit 0
          fi

          if git ls-remote --tags origin refs/tags/v3.8.0 | grep -q .; then
            echo "Tag v3.8.0 already exists."
          else
            git tag v3.8.0 "$TARGET_SHA"
            git push origin refs/tags/v3.8.0
          fi

          cat > /tmp/release-notes.md <<'EOF'
# Humanizer v3.8.0

Initial public release of the Humanizer skills-only ChatGPT plugin.

## Highlights

- Humanizes prose and lyrics while preserving meaning, facts, and writer voice.
- Builds reusable voice fingerprints from supplied writing samples.
- Scores lyric AI-artifact risk on a 0–5 diagnostic scale.
- Scores rap technique separately for multisyllabic rhyme, pocket, cadence, and rhyme density.
- Protects strong lines and repairs weak bars with three-candidate rewrite tournaments.
- Optimizes full 16-bar verses in context.
- Optimizes verse-to-hook setup, section contrast, and transitions.
- Uses BPM and meter for beat-grid-aware pocket analysis.
- Generates contextual bar-by-bar flow patterns.

## Architecture

This is a skills-only Agent Plugin. It requires no MCP server, login, API key, or external data access.

## Validation

The repository's Humanizer validator and GitHub Actions validation workflow pass for the release commit.
EOF

          gh release create v3.8.0             --target "$TARGET_SHA"             --title "Humanizer v3.8.0"             --notes-file /tmp/release-notes.md
