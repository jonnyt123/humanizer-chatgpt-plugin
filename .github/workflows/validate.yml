name: Validate Humanizer Plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plugin package
        run: python3 scripts/validate-plugin.py
      - name: Build submission ZIP
        run: python3 scripts/build-submission.py
      - name: Upload submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-plugin-${{ github.sha }}
          path: dist/humanizer-plugin-v*.zip
          if-no-files-found: error
